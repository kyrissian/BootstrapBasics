<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Basics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">My Website</a>

            <!-- Hamburger Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>
    <div class="container mt-5">
        <!-- REGISTRATION FORM -->
        <h2 class="mb-4">Registration Form</h2>

        <form>

            <div class="row">

                <!-- First Name -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="firstName">First Name</label>
                    <input id="firstName" type="text" class="form-control">
                </div>

                <!-- Last Name -->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input id="lastName" type="text" class="form-control">
                </div>

            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" type="email" class="form-control" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" class="form-control" required>
            </div>

            <!-- Checkbox -->
            <div class="form-check mb-3">
                <input id="terms" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="terms">
                    I agree to the terms
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-success">
                Submit
            </button>

        </form>


        <!-- TABLE -->
        <h2 class="mt-5 mb-3">Registered Users</h2>

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Isaiah</td>
                        <td>Abraham</td>
                        <td>isaiah@email.com</td>
                    </tr>

                    <tr>
                        <td>Jesus</td>
                        <td>Nazareth</td>
                        <td>jesus@email.com</td>
                    </tr>

                    <tr>
                        <td>Ezekiel</td>
                        <td>Eden</td>
                        <td>ezekiel@email.com</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <!-- IMAGE SECTION -->
        <div class="container-fluid mt-5">

            <img src="https://picsum.photos/1200/400" class="img-fluid" alt="Main Image">

        </div>

        <div class="text-center mt-4">

            <img src="https://picsum.photos/200" class="rounded-circle img-fluid" alt="Circle Image">

        </div>

        <!-- BUTTONS -->
        <div class="text-center mt-4 mb-5">

            <button class="btn btn-primary">
                Visible Always
            </button>

            <button class="btn btn-warning d-none d-md-block mt-3 mx-auto">
                Hidden on Small Screens
            </button>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
